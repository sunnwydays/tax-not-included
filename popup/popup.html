<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/scripts/tailwind.js"></script>
    <!-- utils must appear before popup -->
    <script src="/scripts/utils.js"></script>
    <script src="popup.js"></script>
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lusitana:wght@400;700&family=Playwrite+IT+Moderna:wght@100..400&family=Playwrite+MX:wght@100..400&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body class="m-0 text-center min-w-3xs">
    <template id="rate-template">
        <li class="gap-4 mx-8 flex items-center justify-between min-h-7">

            <span class="
                rate-name cursor-pointer min-w-24 p-1 flex justify-start
            "></span>
            <input class="hidden rate-name-input max-w-24 p-1"></input>

            <div class="space-x-2 flex items-center">
                <span class="
                    rate cursor-pointer min-w-14 
                    border border-gray-400 rounded-md p-1 flex justify-end
                "></span>
                <input 
                    type="number" step="0.001" min="0"
                    class="
                        hidden rate-input 
                        invalid:border-pink-500 invalid:text-pink-600
                        max-w-14 p-1
                    "
                ></input>

                <button class="
                    cursor-pointer text-xs remove-rate size-6 m-0
                    bg-[#b03030] hover:bg-[#4a0404] transition-all rounded-md
                    flex justify-center items-center
                    disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-[#b03030]
                ">🗑️</button>
            </div>

        </li>
    </template>
    
    <h1 class="text-xl m-0 p-4 bg-[#517a5e] text-white shadow-sm">
        Tax Not Included
    </h1>
    <button
        id="toggle-tax"
        class="
            text-l px-4 py-2 m-4 cursor-pointer shadow-sm
            border-[#81986e] border-solid border-3 rounded-md
            hover:bg-[#81986e] hover:text-white transition-all
        "
    ></button>
    <p class="text-xs text-gray-500 mt-0 mb-3">
        Shortcut:
        <kbd id="shortcut-display" class="border border-gray-400 rounded px-1"></kbd>
        <button
            id="edit-shortcut"
            class="cursor-pointer underline hover:text-gray-700 transition-all"
        >Change</button>
    </p>
    <button
        id="toggle-site"
        class="
            hidden text-sm px-3 py-1 mx-4 mb-3 cursor-pointer shadow-sm
            border-[#b03030] border-solid border-2 rounded-md
            hover:bg-[#b03030] hover:text-white transition-all
        "
    ></button>
    <button
        id="toggle-grocery"
        class="
            hidden mx-auto text-sm px-3 py-1 mb-3 cursor-pointer shadow-sm
            border-[#81986e] border-solid border-2 rounded-md
            hover:bg-[#81986e] hover:text-white transition-all
        "
    ></button>
    <form id="rate-form">
        <ul id="rate-list" class="space-y-2">
            <!-- input boxes go here -->
        </ul>
    </form>
    <button
        id="new-rate"
        class="
            cursor-pointer p-3
            hover:text-gray-500  transition-all
            disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:text-inherit
        "
    >+ Add tax</button>
    <select
        id="preset"
        aria-label="Load preset tax rates"
        class="
            block mx-auto mb-3 text-sm p-1 cursor-pointer
            border border-gray-400 rounded-md
        "
    >
        <option value="">Load a preset…</option>
    </select>
    <hr class="font-bold text-[#517a5e] w-52 mx-auto border-1 rounded-md">
    <p id="total-rate" class="font-bold m-3"></p>
    <!-- Only shown on sites marked as grocery stores -->
    <div id="grocery-rate-row" class="hidden mb-3">
        <label class="inline-flex items-center gap-2 text-sm">
            Grocery tax (%)
            <input
                id="grocery-rate"
                type="number" step="0.001" min="0"
                class="
                    invalid:border-pink-500 invalid:text-pink-600
                    max-w-16 p-1
                "
            >
        </label>
    </div>
    <a
        href="https://github.com/sunnwydays/tax-not-included/issues/new"
        target="_blank" rel="noopener"
        class="
            block text-xs text-gray-500 underline mb-3
            hover:text-gray-700 transition-all
        "
    >Send feedback or report a bug</a>
</body>
</html>
