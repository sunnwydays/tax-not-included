name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # popup.css is committed so the extension loads unpacked without a build
      - name: Check popup.css is built from the latest classes
        run: npm run build:css && git diff --exit-code popup/popup.css
